# ============================================================================
# Configurações externas do pipeline — RenovaBio × AFOLU
# ============================================================================
# Este arquivo é OPCIONAL nesta fase do pipeline. Os parâmetros principais
# vivem em pipeline/config.py (PARAMS dataclass). Esta YAML existe para
# parametrizações que podem mudar entre runs (e.g., qual critério de filtro
# canavieiro usar) sem precisar editar código.
#
# Para usar em uma sessão Colab:
#     import yaml
#     with open('/content/drive/MyDrive/Renovabio - EcoEco/configs/pipeline.yaml') as f:
#         cfg = yaml.safe_load(f)
